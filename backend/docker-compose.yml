version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: skylab_coders_db
    environment:
      POSTGRES_USER: skylab
      POSTGRES_PASSWORD: password
      POSTGRES_DB: skylab_coders
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: always

  backend:
    build: .
    container_name: skylab_coders_api
    ports:
      - "3001:3000"
    environment:
      DATABASE_URL: "postgresql://skylab:password@db:5432/skylab_coders?schema=public"
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    depends_on:
      - db
    volumes:
      - .:/usr/src/app
      - /usr/src/app/node_modules
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev"

volumes:
  pgdata:
